<!DOCTYPE html>
<html lang="cs">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javascript - kalkulačka</title>
    <script src="script.js"></script>
</head>
<body>
    <input type="text" id="id_display" readonly>
    <input type="button" value="0" onclick="to_display(this);">
    <input type="button" value="1" onclick="to_display(this);">
    <input type="button" value="2" onclick="to_display(this);">
    <input type="button" value="3" onclick="to_display(this);">
    <input type="button" value="4" onclick="to_display(this);">
    <input type="button" value="5" onclick="to_display(this);">
    <input type="button" value="6" onclick="to_display(this);">
    <input type="button" value="7" onclick="to_display(this);">
    <input type="button" value="8" onclick="to_display(this);">
    <input type="button" value="9" onclick="to_display(this);">
    <input type="button" value="+" onclick="operator(this);">
    <input type="button" value="-" onclick="operator(this);">
    <input type="button" value="*" onclick="operator(this);">
    <input type="button" value="/" onclick="operator(this);">
    <input type="button" value="=" onclick="result();">

</body>
</html>
